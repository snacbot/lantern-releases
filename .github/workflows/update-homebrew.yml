name: Update Lantern Homebrew cask

on:
  release:
    types: [published, edited]
  push:
    branches: [main]
    paths: [appcast.xml, .github/workflows/update-homebrew.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lantern-homebrew
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'mac-v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: snacbot/homebrew-tap
          ref: main
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Sync the accepted public Mac release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_lantern.py
      - name: Commit and push updated cask
        run: |
          if git diff --quiet -- Casks/lantern.rb; then
            echo "Lantern cask is already current."
            exit 0
          fi
          git diff --check
          ruby -c Casks/lantern.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/lantern.rb
          git commit -m "Update Lantern cask from published Mac release"
          git pull --rebase origin main
          git push origin HEAD:main
